name: Android 16 security regression

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 6"

concurrency:
  group: apkscanner-android16-regression
  cancel-in-progress: false

jobs:
  benchmark:
    # The runner label is intentionally explicit: a generic CI emulator must never
    # be counted as the API 36 release gate.
    runs-on: [self-hosted, linux, apkscanner-android16]
    timeout-minutes: 240
    env:
      APKSCANNER_VALIDATION_PROFILE: android16_release
      APKSCANNER_DEVICE_MIN_API: "36"
      APKSCANNER_ALLOW_LEGACY_DEVICE_SMOKE: "false"
      APKSCANNER_ADB_SERIAL: ${{ secrets.APKSCANNER_ANDROID16_ADB_SERIAL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      APKSCANNER_DATA_DIR: ${{ github.workspace }}/.regression-data
    steps:
      - uses: actions/checkout@v4
      - name: Verify release device
        run: |
          adb connect "$APKSCANNER_ADB_SERIAL"
          test "$(adb -s "$APKSCANNER_ADB_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" -ge 36
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Build signed regression APK
        run: ./testapk/build-vulntest.sh
      - name: Run formal benchmark
        run: |
          scanctl benchmark "$PWD/testapk/vulntest.apk" \
            --truth "$PWD/testapk/vulntest-ground-truth.json" \
            --investigator codex | tee android16-regression.json
      - name: Upload regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-regression-${{ github.run_id }}
          path: |
            android16-regression.json
            .regression-data/reports
